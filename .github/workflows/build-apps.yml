# Builds the Android apps (APK) and publishes them as a GitHub release.
# Started by hand from the Actions tab: pick which app to build.
# Version and "what's new" come from apps/version.json.
name: Build Android apps
on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app to build
        type: choice
        options: [admin, employee, both]
        default: both
permissions:
  contents: write
env:
  API_URL: https://afford-attendance.abdullah6763939.workers.dev
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Install
        working-directory: apps
        run: npm ci
      - name: Read version
        id: v
        run: |
          echo "version=$(node -p "require('./apps/version.json').version")" >> "$GITHUB_OUTPUT"
          node -e "const v=require('./apps/version.json'); console.log(v.notes.en + '\n\nUR: ' + v.notes.ur)" > release-notes.md
      - name: Build admin app
        if: inputs.app != 'employee'
        run: |
          cd apps && npm run build:admin
          cd admin && npx cap sync android
          cd android && ./gradlew --no-daemon assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/afford-admin-${{ steps.v.outputs.version }}.apk"
      - name: Build employee app
        if: inputs.app != 'admin'
        run: |
          cd apps && npm run build:employee
          cd employee && npx cap sync android
          cd android && ./gradlew --no-daemon assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/afford-employee-${{ steps.v.outputs.version }}.apk"
      - name: Check signature
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          for f in out/*.apk; do "$BT/apksigner" verify --print-certs "$f" | head -3; done
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}-${{ github.run_number }}
          name: Afford ${{ steps.v.outputs.version }} (build ${{ github.run_number }})
          body_path: release-notes.md
          files: out/*.apk
