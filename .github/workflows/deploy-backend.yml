# Deploys the Cloudflare Worker. Runs ONLY when started by hand from the Actions tab.
# Needs repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SETUP_CODE (PIN_PEPPER optional).
name: Deploy backend (manual)
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Deploy worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test the live worker
        run: curl -fsS https://afford-attendance.abdullah6763939.workers.dev/api/info
      - name: Set secrets
        run: |
          if [ -n "$SETUP_CODE" ]; then printf '%s' "$SETUP_CODE" | npx wrangler secret put SETUP_CODE; else echo "SETUP_CODE secret missing"; exit 1; fi
          if [ -n "$PIN_PEPPER" ]; then printf '%s' "$PIN_PEPPER" | npx wrangler secret put PIN_PEPPER; fi
        env:
          SETUP_CODE: ${{ secrets.SETUP_CODE }}
          PIN_PEPPER: ${{ secrets.PIN_PEPPER }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
