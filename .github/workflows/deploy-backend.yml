# Deploys the Cloudflare Worker. Runs ONLY when started by hand from the Actions tab.
# Needs repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SETUP_CODE (PIN_PEPPER, FIREBASE_SERVICE_ACCOUNT optional).
name: Deploy backend (manual)
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Build the web versions (staff for iPhones at /staff/, owner page at /owner/)
        working-directory: apps
        run: |
          npm ci
          cd web && WEB_APP=1 OUT_DIR=../../owner/staff npx vite build --mode employee
          WEB_APP=1 OUT_DIR=../../owner/owner npx vite build --mode admin
      - name: Deploy worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set secrets
        run: |
          if [ -n "$SETUP_CODE" ]; then printf '%s' "$SETUP_CODE" | npx wrangler secret put SETUP_CODE; else echo "SETUP_CODE secret missing"; exit 1; fi
          if [ -n "$PIN_PEPPER" ]; then printf '%s' "$PIN_PEPPER" | npx wrangler secret put PIN_PEPPER; fi
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | npx wrangler secret put FIREBASE_SERVICE_ACCOUNT; else echo "No FIREBASE_SERVICE_ACCOUNT: instant push is off"; fi
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SETUP_CODE: ${{ secrets.SETUP_CODE }}
          PIN_PEPPER: ${{ secrets.PIN_PEPPER }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check the live worker (new deploys can take a minute to appear)
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://afford-attendance.abdullah6763939.workers.dev/api/info; then exit 0; fi
            sleep 10
          done
          exit 1
