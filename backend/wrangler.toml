# Cloudflare Worker for Afford Super Store attendance & payroll (Workers Free plan).
name = "afford-attendance"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "STORE"
class_name = "StoreDO"

# Free plan needs SQLite-backed Durable Objects
[[migrations]]
tag = "v1"
new_sqlite_classes = ["StoreDO"]

[vars]
STORE_ID = "afford"
GITHUB_REPO = "Abdullah39391010/afford-attendance"
# DANGER: changing this value erases every record once (owner asked for a fresh start 2026-11-17).
WIPE_TOKEN = "fresh-2026-11-17"

# Owner web page (stage 4)
[assets]
directory = "../owner"
binding = "ASSETS"
run_worker_first = ["/api/*", "/"]

# Secrets (set with `npx wrangler secret put NAME`, never committed):
#   SETUP_CODE  - one-time code used to create the owner account
#   PIN_PEPPER  - long random string mixed into every PIN hash
